[package]
name = "dsh-client"
version = "0.1.0"
description = "Thin desktop client for DeepSeek Harness"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
