<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #12203f 0%, #0b1120 55%, #070b14 100%);
    color: #e6edf7;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card { text-align: center; max-width: 560px; padding: 0 32px; }
  .spinner {
    width: 56px; height: 56px; margin: 0 auto 28px;
    border-radius: 50%;
    border: 4px solid rgba(120,160,255,.15);
    border-top-color: #4d7cff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .02em; margin-bottom: 8px; }
  .sub { color: #8fa3c4; font-size: 13px; margin-bottom: 22px; }
  .status {
    min-height: 22px; font-size: 13px; color: #aab8d4;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
    border-radius: 999px; padding: 7px 16px; display: inline-block;
    transition: color .2s;
  }
  .status.error { color: #ff8f8f; border-color: rgba(255,120,120,.25); background: rgba(255,90,90,.07); }
  .status.ok { color: #8ff0b0; }
  .foot { margin-top: 34px; font-size: 12px; color: #4d5f80; }
  .foot code { color: #7d95c4; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spin"></div>
    <h1>DeepSeek Harness</h1>
    <div class="sub">正在准备本地开发环境…</div>
    <div class="status" id="status">正在初始化…</div>
    <div class="foot">首次启动会自动构建 <code>deepseek-harness</code>（约 1 分钟），之后启动即秒开。</div>
  </div>
<script>
  (function () {
    var statusEl = document.getElementById('status');
    var spinEl = document.getElementById('spin');
    function apply(s) {
      statusEl.textContent = s.message || '…';
      statusEl.className = 'status' + (s.phase === 'error' ? ' error' : s.phase === 'ready' ? ' ok' : '');
      if (s.phase === 'error') spinEl.style.display = 'none';
    }
    async function poll() {
      try {
        var api = window.__TAURI__;
        if (!api || !api.core) throw new Error('no-ipc');
        var s = await api.core.invoke('server_status');
        apply(s);
      } catch (e) {
        // IPC unavailable (e.g. page opened in a normal browser): static text
        statusEl.textContent = '正在启动…';
      }
    }
    poll();
    setInterval(poll, 500);
  })();
</script>
</body>
</html>
